name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 15

      - name: Build Angular application
        run: |
          npx ng build --base-href /kyntcorewebsite/

      - name: Find Angular output
        id: find-output
        run: |
          echo "=== DIST DIRECTORY ==="
          find ./dist -maxdepth 5 -type f -name "index.html" -print

          INDEX_FILE=$(find ./dist -type f -name "index.html" | head -1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not generated"
            exit 1
          fi

          OUTPUT_DIR=$(dirname "$INDEX_FILE")

          echo "Found index.html: $INDEX_FILE"
          echo "Angular output directory: $OUTPUT_DIR"

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Pages
        run: |
          rm -rf ./pages
          mkdir -p ./pages

          cp -R "${{ steps.find-output.outputs.output_dir }}/." ./pages/

          echo "=== PAGES CONTENTS ==="
          find ./pages -maxdepth 3 -type f -print

          echo "=== CHECK INDEX ==="
          test -f ./pages/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
