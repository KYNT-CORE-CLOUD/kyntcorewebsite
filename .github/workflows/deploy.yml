name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        timeout-minutes: 15

      - name: Build Angular application
        run: |
          npx ng build \
            --base-href /kyntcorewebsite/ \
            --deploy-url /kyntcorewebsite/

      - name: Verify build
        run: |
          echo "=== Files ==="
          find ./dist/browser -maxdepth 2 -type f

          echo "=== index.html ==="
          test -f ./dist/browser/index.html

          echo "=== Script references ==="
          grep -oE 'src="[^"]+\.js"' ./dist/browser/index.html || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
